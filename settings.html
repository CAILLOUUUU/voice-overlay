<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Overlay - Caillou feat Claude</title>
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/fonts.css" id="fontcss">
<style>
  @font-face { font-family: "Plus Jakarta Sans"; font-weight: 200 800; font-display: swap; src: url("/webfonts/plus-jakarta-sans-var.woff2") format("woff2"); }
  :root {
    --bg: #131619; --bar: #0d0f10; --panel: #1b1e25; --panel2: #232731; --field: #171a20;
    --line: rgba(255, 255, 255, .08); --line2: rgba(255, 255, 255, .14);
    --text: #f3f4f8; --dim: #9b9ea6; --faint: #686b72;
    --accent: #a6b0f2; --accent2: #7989ec; --gold: #ffd47d; --ok: #4ac97e; --warn: #ffb547; --bad: #f7665e;
    --r: 6px;
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: #343843 var(--bg); accent-color: var(--accent2); }
  ::selection { background: rgba(121, 137, 236, .45); color: #fff; }
  body { margin: 0; color: var(--text); font: 14px/1.5 "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif; font-variant-numeric: tabular-nums;
         background: radial-gradient(1100px 420px at 70% -180px, rgba(121, 137, 236, .13), transparent 70%), var(--bg); min-height: 100vh; }
  [hidden] { display: none !important; }
  a { color: var(--accent); text-underline-offset: 3px; }
  code { background: var(--field); padding: 1px 5px; border-radius: 4px; font-family: Consolas, ui-monospace, monospace; font-size: 12.5px; }

  /* ---------- Barre du haut ---------- */
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 24px; background: var(--bar); border-bottom: 1px solid var(--line); }
  header img { border-radius: 8px; }
  h1 { margin: 0; display: flex; flex-direction: column; line-height: 1.05; }
  h1 b { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
  h1 small { font-size: 11px; font-weight: 500; color: var(--dim); }
  #status { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px 5px 10px; min-width: 0; }
  #statusText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 52vw; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .spacer { flex: 1; }
  #updateBar { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; background: #1d2140; border-bottom: 1px solid rgba(166, 176, 242, .35); padding: 9px 24px; font-size: 14px; }
  #updateBar a { font-weight: 700; }
  #updateState { color: var(--dim); }

  /* ---------- Contrôles ---------- */
  input[type=text], input[type=password], select, textarea {
    background: var(--field); color: var(--text); border: 1px solid var(--line2); border-radius: var(--r);
    padding: 7px 10px; font: inherit; min-width: 0; transition: border-color .15s;
  }
  input[type=text]:hover, input[type=password]:hover, select:hover, textarea:hover { border-color: rgba(255, 255, 255, .22); }
  input[type=text], input[type=password], textarea { width: 100%; }
  ::placeholder { color: var(--faint); }
  textarea { min-height: 90px; font-family: Consolas, ui-monospace, monospace; font-size: 12.5px; resize: vertical; }
  select { cursor: pointer; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=color] { width: 44px; height: 30px; padding: 0; border: 1px solid var(--line2); border-radius: var(--r); background: none; cursor: pointer; }
  input[type=range] { width: 150px; }
  input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; }
  .val { width: 44px; text-align: right; color: var(--dim); }
  button { background: var(--accent); color: #12141c; border: 0; border-radius: var(--r); padding: 8px 14px; font: inherit; font-weight: 700; cursor: pointer; transition: background-color .15s, border-color .15s, color .15s; }
  button:hover { background: #bcc4f7; }
  button.primary { background: var(--gold); color: #1d1606; }
  button.primary:hover { background: #ffdf9c; }
  button.ghost { background: var(--panel2); border: 1px solid var(--line2); color: var(--text); font-weight: 600; }
  button.ghost:hover { background: #2b303c; border-color: rgba(255, 255, 255, .24); }
  button:disabled { opacity: .35; cursor: default; }
  .askbox { margin-top: 12px; padding: 12px 14px; border: 1px solid rgba(247, 102, 94, .35); border-radius: 10px; background: rgba(247, 102, 94, .06); }
  .askbox p { margin: 0 0 10px; line-height: 1.5; }
  button.danger:hover, button.confirm { border-color: var(--bad) !important; color: var(--bad) !important; background: rgba(247, 102, 94, .08) !important; }
  .err { color: var(--bad); min-height: 1.2em; margin: 6px 0 0; }
  .ok-msg { color: var(--ok) !important; }
  .muted { color: var(--dim); font-size: 13px; margin: 0; }

  /* ---------- Mise en page ---------- */
  main { display: grid; grid-template-columns: minmax(360px, 500px) 1fr; gap: 28px; padding: 0 24px 24px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } #previewBox { position: static !important; } #stage { height: 440px !important; } }
  section, details.more { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; overflow: hidden; }
  /* Marque DPM : une barre de couleur sous chaque carte */
  section::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, var(--accent2), var(--accent)); opacity: .85; }
  h2 { font-size: 15px; font-weight: 800; letter-spacing: -.01em; margin: 0 0 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 7px 0; }
  .row > span { flex: 1; min-width: 0; }
  .row small, .sub small { display: block; color: var(--dim); font-size: 12px; line-height: 1.45; }
  .row.stack { flex-direction: column; align-items: stretch; gap: 6px; }
  .row + .row { border-top: 1px solid var(--line); }
  .sub { display: block; margin: 12px 0 6px; font-weight: 600; }
  .url { display: flex; gap: 8px; }
  .url input { font-family: Consolas, ui-monospace, monospace; font-size: 12.5px; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .lead { margin: -4px 0 12px; }
  .hint { margin-top: 8px; }
  #dataPath { overflow-wrap: anywhere; }
  footer { text-align: center; color: var(--faint); font-size: 12.5px; padding: 0 0 28px; }
  footer a { color: var(--dim); }

  /* ---------- Onglets ---------- */
  .ptabs { position: sticky; top: 0; z-index: 3; display: flex; gap: 4px; background: var(--bg); border-bottom: 1px solid var(--line); margin-bottom: 16px; padding-top: 14px; }
  .ptabs button { display: inline-flex; align-items: center; gap: 7px; background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0;
                  color: var(--dim); font-weight: 700; padding: 10px 12px 9px; margin-bottom: -1px; }
  .ptabs button:hover { color: var(--text); background: none; }
  .ptabs button[aria-selected=true] { color: var(--text); border-bottom-color: var(--accent); }
  .count { min-width: 20px; padding: 0 6px; border-radius: 4px; background: var(--accent); color: #12141c; font-size: 11px; font-weight: 800; line-height: 18px; text-align: center; }
  .count.live { background: var(--ok); color: #06180d; }

  /* ---------- Personnes : un classement DPM qu'on peut modifier ---------- */
  #leagueInfo { margin-bottom: 10px; font-size: 12.5px; }
  .dpmrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; font-size: 13px; font-weight: 600; }
  .dpmdot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); flex: none; }
  .dpmdot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  #dpmHelp { font-weight: 500; font-size: 12.5px; }
  .rolesnote { margin-top: 8px; font-size: 12.5px; }
  #leagueInfo:empty { display: none; }
  .empty { color: var(--dim); margin: 4px 0; padding: 22px; border: 1px dashed var(--line2); border-radius: 8px; text-align: center; }
  #people { display: flex; flex-direction: column; margin: 0 -18px; }
  .person { display: grid; grid-template-columns: 40px 36px minmax(0, 1fr) 124px 34px; align-items: center; gap: 10px; padding: 8px 18px; border-top: 1px solid var(--line); background: var(--panel); }
  .person:first-child { border-top: 0; }
  .person:hover { background: #1f232b; }
  /* Poignée toujours visible (souris et doigt) : grip + numéro. Rangé par rôle : cadenas à la place du grip. */
  .person .handle { width: 40px; height: 32px; padding: 0 4px; display: flex; align-items: center; justify-content: center; gap: 5px; background: none; border: 1px solid transparent; color: var(--dim); font-weight: 800; font-size: 13px; cursor: grab; touch-action: none; }
  .person .handle:hover { background: var(--panel2); border-color: var(--line2); color: var(--text); }
  .person .handle svg { width: 10px; height: 14px; flex: none; }
  .person .handle .grip { fill: currentColor; opacity: .7; }
  .person .handle .lock { display: none; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
  .person .handle:disabled { cursor: default; opacity: 1; color: var(--faint); background: none; border-color: transparent; }
  .person .handle:disabled .grip { display: none; }
  .person .handle:disabled .lock { display: block; }
  .person .av { position: relative; width: 36px; height: 36px; }
  .person .av img { width: 36px; height: 36px; border-radius: 50%; background: var(--panel2); display: block; }
  .person .av::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid transparent; transition: border-color .12s; }
  .person.speaking .av::after { border-color: var(--ok); }
  .person .who { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .person .who input { background: transparent; border-color: transparent; padding: 3px 6px; margin-left: -7px; font-weight: 700; font-size: 14.5px; }
  .person .who input::placeholder { color: var(--text); opacity: 1; }
  .person .who input:hover { border-color: var(--line2); background: var(--field); }
  .person .who input:focus { background: var(--field); border-color: var(--accent2); }
  .person .who input:not(:placeholder-shown) { color: var(--gold); }
  .person .meta { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; }
  .person .pill { display: none; border-radius: 4px; padding: 0 6px; font-size: 11px; font-weight: 800; line-height: 17px; }
  .person.speaking .pill.talk { display: inline-block; background: var(--ok); color: #06180d; }
  .person.muted .pill.talk { display: none !important; }
  .person .pill.mstate { background: rgba(247, 102, 94, .15); color: var(--bad); }
  .person .pill.mstate:not(:empty) { display: inline-block; }
  .person .riot { color: var(--accent); overflow: hidden; text-overflow: ellipsis; }
  .person .riot button { background: none; border: 0; color: var(--dim); padding: 0 2px; font-size: 11.5px; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
  .person .riot button:hover { color: var(--bad); background: none; }
  .person .rolesel { width: 124px; padding: 6px 4px 6px 8px; font-weight: 700; font-size: 12.5px; }
  .person .rolesel.set { color: var(--gold); border-color: rgba(255, 212, 125, .35); }
  .person .eye { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; background: none; border: 1px solid transparent; color: var(--dim); }
  .person .eye:hover { background: var(--panel2); border-color: var(--line2); color: var(--text); }
  .person .eye svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .person .eye .off { display: none; }
  .person.off .eye .on { display: none; }
  .person.off .eye .off { display: block; }
  .person.off .eye { color: var(--bad); }
  .person.off .who, .person.off .av { opacity: .4; }
  .person.off .who input { text-decoration: line-through; }
  .person.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: rgba(166, 176, 242, .22); } to { background: var(--panel); } }
  .person.dragging { position: relative; z-index: 2; background: var(--panel2); box-shadow: 0 8px 22px rgba(0, 0, 0, .5); }
  .person.dragging .handle { cursor: grabbing; }
  body.dragging { user-select: none; -webkit-user-select: none; }
  #peopleFoot { margin-top: 12px; font-size: 12.5px; }
  @media (max-width: 520px) { main { padding: 0 12px 16px; } header { padding: 10px 12px; } #people { margin: 0 -14px; } section { padding: 14px; } .person { grid-template-columns: 36px 30px minmax(0, 1fr) 96px 30px; gap: 6px; padding: 8px 14px; } .person .av, .person .av img { width: 30px; height: 30px; } .person .rolesel { width: 96px; font-size: 12px; } .person .eye { width: 30px; } }

  /* ---------- Parties repliables ---------- */
  details.more, details.group { padding-top: 0; padding-bottom: 0; }
  details.group { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0 18px; margin-bottom: 14px; overflow: hidden; }
  details > summary { cursor: pointer; padding: 14px 0; font-weight: 800; font-size: 15px; list-style: none; display: flex; align-items: center; gap: 10px; }
  details.more > summary { font-size: 13.5px; font-weight: 700; color: var(--dim); }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: ""; margin-left: auto; width: 7px; height: 7px; border-right: 2px solid var(--dim); border-bottom: 2px solid var(--dim); transform: rotate(45deg) translate(-2px, -2px); transition: transform .15s; }
  details[open] > summary::after { transform: rotate(-135deg) translate(-2px, -2px); }
  details > summary:hover { color: var(--text); }
  details[open] { padding-bottom: 12px; }
  details.group summary small { font-weight: 500; font-size: 12px; color: var(--dim); }
  .endrow { margin: 4px 2px 0; }

  /* ---------- Styles prêts à l'emploi ---------- */
  .presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .preset { display: flex; flex-direction: column; gap: 7px; padding: 7px; border: 1px solid var(--line2); border-radius: 8px; background: var(--field); color: var(--text); font-weight: 600; text-align: left; }
  .preset:hover { border-color: var(--accent); background: var(--field); }
  .preset.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .preset .mini { display: flex; flex-direction: column; gap: 4px; padding: 8px; border-radius: 5px; background: #3a4654; min-height: 66px; justify-content: center; }
  .preset .mini.row { flex-direction: row; align-items: center; justify-content: flex-start; }
  .preset .card { display: flex; align-items: center; gap: 5px; padding: 2px 7px 2px 2px; border-radius: 999px; width: max-content; font-size: 10px; }
  .preset .mini.row .card { padding: 2px; }
  .preset .dot { width: 14px; height: 14px; flex: none; background: #8a8f99; }
  .preset .lbl { font-size: 12.5px; }

  /* ---------- Profils et aperçu ---------- */
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  .tabs button { background: transparent; border: 1px solid transparent; color: var(--dim); font-weight: 700; padding: 6px 12px; }
  .tabs button:hover { color: var(--text); background: var(--panel); }
  .tabs button.on { background: var(--panel2); border-color: var(--line2); color: var(--accent); }
  .tabs button.add { border: 1px dashed var(--line2); }
  #previewBox { position: sticky; top: 0; align-self: start; }
  .profbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 0 10px; }
  .ighead { margin: 22px 0 8px; }
  #igKey { min-width: 130px; font-variant-numeric: tabular-nums; }
  #igKey.listening, #igPlace.listening { border-color: var(--accent2); color: var(--accent2); }
  .profbar .lbl { color: var(--dim); font-size: 13px; font-weight: 600; }
  #stage { position: relative; border-radius: 12px; border: 1px solid var(--line); overflow: hidden; height: min(660px, calc(100vh - 190px)); min-height: 360px; background: #3a4654; display: grid; place-items: center; }
  #stage.bg-dark { background: #0d0f10; }
  #stage.bg-light { background: #d9dce3; }
  #stage.bg-green { background: #00b140; }
  /* La source OBS à sa vraie taille (400 × 600), réduite pour tenir */
  #source { position: relative; width: 400px; height: 600px; flex: none; outline: 1px dashed rgba(255, 255, 255, .35); outline-offset: 0; transform-origin: center; }
  #stage.bg-light #source { outline-color: rgba(0, 0, 0, .3); }
  #source iframe { width: 400px; height: 600px; border: 0; display: block; }
  #sourceLbl { position: absolute; left: 10px; bottom: 8px; font-size: 11.5px; font-weight: 600; color: rgba(255, 255, 255, .75); background: rgba(13, 15, 16, .6); border-radius: 4px; padding: 2px 7px; pointer-events: none; }
  .bar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; color: var(--dim); font-size: 13px; }
  .bar button { padding: 4px 10px; font-size: 12px; }
  .bar button.on { color: var(--accent); border-color: rgba(166, 176, 242, .5); }

  /* ---------- OBS, appli ---------- */
  #diagText { margin-top: 8px; min-height: 140px; }

  /* ---------- Assistant ---------- */
  #wizard { position: fixed; inset: 0; z-index: 10; background: rgba(8, 9, 11, .9); overflow: auto; padding: 32px 16px; }
  .wz { position: relative; max-width: 620px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; padding: 26px 30px; font-size: 15.5px; line-height: 1.55; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
  .wz-x { position: absolute; top: 12px; right: 12px; padding: 2px 10px; font-size: 18px; }
  .wz-head { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
  .wz-head img { border-radius: 12px; }
  .wz-head b { display: block; font-size: 19px; font-weight: 800; }
  .wz-head span { color: var(--dim); font-size: 14px; }
  .wz-dots { display: flex; gap: 6px; margin-bottom: 18px; }
  .wz-dots i { flex: 1; height: 4px; border-radius: 99px; background: var(--line2); }
  .wz-dots i.on { background: var(--accent); }
  .wz-dots i.done { background: var(--ok); }
  .wz h3 { margin: 0 0 8px; font-size: 18px; font-weight: 800; }
  .wz p { margin: 0 0 12px; }
  .wz ol { color: var(--text); padding-left: 22px; margin: 0 0 16px; }
  .wz ol li { margin-bottom: 9px; }
  .wz .k { display: inline-block; background: var(--panel2); border: 1px solid var(--line2); border-radius: 5px; padding: 0 7px; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .wz .big { display: block; text-align: center; background: var(--gold); color: #1d1606; text-decoration: none; font-weight: 800; padding: 13px; border-radius: 8px; margin-bottom: 12px; }
  .wz .tip { color: var(--dim); font-size: 13.5px; }
  .wz label { display: block; margin: 14px 0 6px; }
  .wz input { font-size: 15px; padding: 10px 12px; }
  .copybox { display: flex; align-items: center; gap: 10px; background: var(--field); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 6px 6px 12px; margin: 8px 0; }
  .copybox code { flex: 1; background: none; font-size: 15px; padding: 0; }
  .wz-state { text-align: center; padding: 10px 0 4px; }
  .wz-state #wzIcon, .wz-state #wzDoneIcon { display: grid; place-items: center; width: 56px; height: 56px; margin: 0 auto 8px; border-radius: 50%; background: var(--panel2); color: var(--accent); }
  .wz-state svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .wz-state #wzDoneIcon.ok { color: var(--ok); background: rgba(74, 201, 126, .12); }
  .wz-state #wzIcon.bad { color: var(--bad); background: rgba(247, 102, 94, .12); }
  .wz-state .wait svg { animation: spin 1.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .wz-state .wait svg { animation: none; } }
  .wz-why { color: var(--dim); }
  .wz-list li::marker { color: var(--accent); font-weight: 800; }
  .field { position: relative; }
  .field input { padding-right: 40px; }
  .field input.good { border-color: rgba(74, 201, 126, .6); }
  .field input.bad { border-color: rgba(247, 102, 94, .7); }
  .fieldok { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--ok); }
  .fieldok svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .wz-hint { min-height: 1.3em; margin: 6px 0 0 !important; font-size: 13.5px; color: var(--dim); }
  .wz-hint.bad { color: var(--bad); }
  .wz-hint.good { color: var(--ok); }
  .task { display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
  .task p { margin: 0 0 6px !important; }
  .tnum { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: var(--panel2); border: 1px solid var(--line2); color: var(--accent); font-weight: 800; font-size: 13px; }
  .wz-tips { text-align: left; margin: 6px auto 0; max-width: 460px; padding-left: 20px; color: var(--dim); font-size: 14px; }
  .wz-tips li { margin-bottom: 6px; }
  .wz-tips b { color: var(--text); }
  .wz-actions { display: flex; gap: 10px; justify-content: center; margin: 14px 0 4px; }
  .wz-nav { display: flex; align-items: center; margin-top: 8px; }
  .wz-nav button { padding: 10px 18px; }
  #updateBar button { padding: 4px 12px; }
  header select { padding: 6px 8px; background: var(--panel); }
</style>
</head>
<body>
<header>
  <img src="/icon.png" alt="" width="34" height="34" style="border-radius:9px">
  <h1><b>Voice Overlay</b><small>Caillou feat Claude</small></h1>
  <div id="status"><span id="dot"></span><span id="statusText">…</span></div>
  <span class="spacer"></span>
  <select id="langSel" aria-label="Langue / Language"><option value="fr">Français</option><option value="en">English</option></select>
</header>
<div id="updateBar" hidden><span id="updateText"></span><a id="updateLink" target="_blank" rel="noopener" data-t="download"></a><button class="primary" id="updateInstall" data-t="updInstall" hidden></button><span id="updateState"></span></div>

<div id="wizard" hidden>
  <div class="wz" role="dialog">
    <button class="ghost wz-x" id="wzClose">×</button>
    <div class="wz-head">
      <img src="/icon.png" alt="" width="46" height="46">
      <div><b data-t="wzHead"></b><span data-t="wzSub"></span></div>
    </div>
    <div class="wz-dots" id="wzDots"></div>

    <div class="wz-step" id="wzS0">
      <h3 data-t="w1Title"></h3>
      <p class="wz-why" data-t="w1Why"></p>
      <a class="big" href="https://discord.com/developers/applications" target="_blank" rel="noopener" data-t="w1Open"></a>
      <ol class="wz-list"><li data-t="w1a"></li><li data-t="w1b"></li><li data-t="w1c"></li></ol>
      <label for="cid" data-t="w1IdLabel"></label>
      <div class="field"><input type="text" id="cid" autocomplete="off" spellcheck="false" inputmode="numeric" data-tp="w1IdPh"><span class="fieldok" id="cidOk" hidden></span></div>
      <p class="wz-hint" id="cidHint"></p>
    </div>
    <div class="wz-step" id="wzS1" hidden>
      <h3 data-t="w2Title"></h3>
      <a class="big" id="wzOauth" href="https://discord.com/developers/applications" target="_blank" rel="noopener" data-t="w2Open"></a>
      <div class="task"><span class="tnum">A</span><div>
        <p data-t="w2a"></p>
        <div class="copybox"><code>http://localhost</code><button data-copy="http://localhost" data-t="copy"></button></div>
        <p class="tip" data-t="w2aSave"></p>
      </div></div>
      <div class="task"><span class="tnum">B</span><div>
        <p data-t="w2b"></p>
        <div class="field"><input type="password" id="csecret" autocomplete="off" spellcheck="false" data-tp="w2bPh"><span class="fieldok" id="csecretOk" hidden></span></div>
        <p class="wz-hint" id="csecretHint"></p>
      </div></div>
      <p class="tip" data-t="w2Tip"></p>
    </div>
    <div class="wz-step" id="wzS2" hidden>
      <div class="wz-state"><div id="wzIcon"></div><h3 id="wzTitle"></h3><p id="wzText"></p></div>
      <ul class="wz-tips" id="wzTips" hidden></ul>
      <div class="wz-actions" id="wzFail" hidden>
        <button class="ghost" id="wzFix" data-t="fixCodes"></button>
        <button id="wzRetry" data-t="retry"></button>
      </div>
    </div>
    <div class="wz-step" id="wzS3" hidden>
      <div class="wz-state"><div id="wzDoneIcon"></div><h3 id="wzDoneTitle"></h3><p data-t="w4Text"></p></div>
      <div class="wz-actions"><button class="primary" id="wzFinish" data-t="w4Later"></button></div>
      <p class="tip" style="text-align:center;margin-top:14px" data-t="w4Manual"></p>
      <div class="copybox"><code id="wzUrl"></code><button data-copy="" data-t="copy"></button></div>
    </div>

    <p class="err" id="wzErr"></p>
    <div class="wz-nav"><button class="ghost" id="wzBack" data-t="back"></button><span class="spacer"></span><button class="primary" id="wzNext"></button></div>
  </div>
</div>

<main>
  <div id="panel">
    <nav class="ptabs" role="tablist" id="ptabs">
      <button role="tab" id="tab-people" aria-controls="pane-people" data-pane="people"><span data-t="tabPeople"></span><span class="count" id="peopleCount" hidden></span></button>
      <button role="tab" id="tab-style" aria-controls="pane-style" data-pane="style" data-t="tabStyle"></button>
      <button role="tab" id="tab-obs" aria-controls="pane-obs" data-pane="obs" data-t="tabObs"></button>
      <button role="tab" id="tab-ingame" aria-controls="pane-ingame" data-pane="ingame" data-t="tabIngame"></button>
      <button role="tab" id="tab-app" aria-controls="pane-app" data-pane="app" data-t="tabApp"></button>
    </nav>

    <div class="pane" id="pane-people" role="tabpanel" aria-labelledby="tab-people">
      <section>
        <div class="dpmrow"><span class="dpmdot" id="dpmDot"></span><span id="dpmText"></span><a id="dpmHelp" href="https://github.com/CAILLOUUUU/voice-overlay/tree/main/extension" target="_blank" rel="noopener" data-t="dpmHelp" hidden></a></div>
        <p class="muted" id="leagueInfo"></p>
        <p class="empty" id="peopleEmpty" data-t="peopleEmpty"></p>
        <div id="people"></div>
        <p class="muted" id="peopleFoot" hidden data-t="peopleHelp"></p>
        <p class="muted rolesnote" id="rolesNote" hidden data-t="rolesNote"></p>
      </section>
      <details class="more">
        <summary data-t="peopleMore"></summary>
        <div class="row"><span><label for="forgetSel" data-t="forgetLabel"></label><small data-t="forgetHelp"></small></span>
          <select id="forgetSel">
            <option value="0" data-t="forget0"></option><option value="2" data-t="forget2"></option>
            <option value="10" data-t="forget10"></option><option value="60" data-t="forget60"></option>
            <option value="-1" data-t="forgetNever"></option>
          </select></div>
        <div class="btnrow"><button class="ghost danger" id="peopleReset" data-t="peopleReset"></button>
          <button class="ghost" id="linksReset"></button></div>
        <div class="askbox" id="linksAsk" hidden>
          <p id="linksWhy"></p>
          <div class="btnrow"><button class="ghost danger" id="linksYes" data-t="linksYes"></button><button class="ghost" id="linksNo" data-t="linksNo"></button></div>
        </div>
      </details>
    </div>

    <div class="pane" id="pane-style" role="tabpanel" aria-labelledby="tab-style" hidden>
     <div id="styleBox">
      <section>
        <h2 data-t="presetTitle"></h2>
        <p class="muted lead" data-t="presetHelp"></p>
        <div class="presets" id="presets"></div>
        <div class="btnrow" style="margin-top:10px"><button class="ghost" id="presetUndo" data-t="presetUndo" hidden></button></div>
      </section>
      <div id="form"></div>
      <details class="more">
        <summary data-t="styleShare"></summary>
        <p class="muted lead" data-t="styleShareHelp"></p>
        <div class="btnrow">
          <button class="ghost" id="exportBtn" data-t="exportBtn"></button>
          <button class="ghost" id="importBtn" data-t="importBtn"></button>
          <input type="file" id="importPicker" accept=".json" hidden>
        </div>
        <p class="err" id="importMsg"></p>
      </details>
      <div class="row endrow"><span><span data-t="resetLabel"></span><small data-t="resetHelp"></small></span><button class="ghost danger" id="resetBtn" data-t="resetBtn"></button></div>
     </div>
    </div>

    <div class="pane" id="pane-obs" role="tabpanel" aria-labelledby="tab-obs" hidden>
      <section>
        <h2 data-t="obsTitle"></h2>
        <div class="url"><input type="text" id="obsUrl" readonly aria-label="OBS"><button class="primary" id="copyBtn" data-copy="" data-t="copy"></button></div>
        <p class="muted hint" data-t="obsHelp"></p>
      </section>
      <section>
        <label class="sub" for="profName" data-t="profName"></label>
        <input type="text" id="profName" maxlength="40" autocomplete="off">
        <div class="row endrow" id="profDelRow"><span></span><button class="ghost" id="profDel" data-t="profDel"></button></div>
      </section>
    </div>

    <div class="pane" id="pane-ingame" role="tabpanel" aria-labelledby="tab-ingame" hidden>
      <section>
        <h2 data-t="igTitle"></h2>
        <p class="muted lead" data-t="igHelp"></p>
        <div class="row"><span><label for="igOn" data-t="igOn"></label><small data-t="igOnHelp"></small></span><input type="checkbox" id="igOn"></div>
        <div id="igMore">
          <div class="row"><span><span data-t="igKey"></span><small data-t="igKeyHelp"></small></span><button class="ghost" id="igKey"></button></div>
          <p class="err" id="igKeyMsg"></p>
          <div class="row"><span><span data-t="igPlace"></span><small data-t="igPlaceHelp"></small></span><button class="ghost" id="igPlace"></button></div>
          <div class="row"><span><span data-t="igReset"></span><small data-t="igResetHelp"></small></span><button class="ghost" id="igReset" data-t="igResetBtn"></button></div>
        </div>
      </section>
      <h2 class="ighead" data-t="igStyle"></h2>
      <div id="igStyleHost"></div>
    </div>

    <div class="pane" id="pane-app" role="tabpanel" aria-labelledby="tab-app" hidden>
      <section>
        <div class="row"><span><span data-t="credLabel"></span><small data-t="credHelp"></small></span><button class="ghost" id="credBtn" data-t="credBtn"></button></div>
        <div class="row" id="autoRow" hidden><span><label for="autostart" data-t="autostart"></label><small data-t="autostartHelp"></small></span><input type="checkbox" id="autostart"></div>
        <div class="row" id="dataRow" hidden><span><span data-t="dataLabel"></span><small id="dataPath"></small></span><button class="ghost" id="dataBtn" data-t="dataBtn"></button></div>
        <div id="diagRow" hidden>
          <div class="row"><span><span data-t="diagLabel"></span><small data-t="diagHelp"></small></span><button class="ghost" id="diagBtn" data-t="diagBtn"></button></div>
          <p class="ok-msg muted" id="diagMsg" hidden></p>
          <textarea id="diagText" readonly hidden spellcheck="false"></textarea>
        </div>
        <div class="row"><span><span data-t="quitLabel"></span><small data-t="quitHelp"></small></span><button class="ghost danger" id="quitBtn" data-t="quit"></button></div>
      </section>
    </div>
  </div>

  <div id="previewBox">
    <div class="profbar"><span class="lbl" data-t="profileLabel"></span><div class="tabs" id="profTabs"></div></div>
    <div id="stage"><div id="source"><iframe src="about:blank" title="Preview"></iframe><span id="sourceLbl"></span></div></div>
    <div class="bar"><span data-t="preview"></span>
      <button class="ghost" data-bg="" data-t="bgGame"></button>
      <button class="ghost" data-bg="bg-dark" data-t="bgDark"></button>
      <button class="ghost" data-bg="bg-light" data-t="bgLight"></button>
      <button class="ghost" data-bg="bg-green" data-t="bgGreen"></button>
    </div>
  </div>
</main>
<footer><span id="ver"></span> · <a href="/licences" target="_blank" data-t="licences"></a></footer>

  };
  let lang = 'fr', S = L.fr;
  const msg = x => !x ? '' : typeof x === 'string' ? x : (x[lang] || x.fr || '');

  const schema = () => [
    [S.secTitle, [
      { k: 'showTitle', t: 'bool', label: S.showTitle },
      { k: 'titleText', t: 'text', label: S.titleText, help: S.titleHelp },
    ]],
    [S.secLayout, [
      { k: 'layout', t: 'select', label: S.layout, opts: { column: S.column, row: S.row } },
      { k: 'align', t: 'select', label: S.align, opts: { left: S.left, right: S.right } },
      { k: 'size', t: 'range', label: S.size, min: 20, max: 120, unit: 'px' },
      { k: 'gap', t: 'range', label: S.gap, min: 0, max: 30, unit: 'px' },
      { k: 'shape', t: 'select', label: S.shape, opts: { circle: S.circle, rounded: S.rounded, square: S.square } },
    ]],
    [S.secContent, [
      { k: 'showNames', t: 'bool', label: S.showNames },
      { k: 'showIcons', t: 'bool', label: S.showIcons },
      { k: 'showDecorations', t: 'bool', label: S.showDecorations },
      { k: 'showRoles', t: 'bool', label: S.showRoles },
      { k: 'hideSelf', t: 'bool', label: S.hideSelf },
      { k: 'speakingOnly', t: 'bool', label: S.speakingOnly },
      { k: 'dimSilent', t: 'bool', label: S.dimSilent },
    ]],
    [S.secStyle, [
      { k: 'effect', t: 'select', label: S.effect, opts: { ring: S.ring, glow: S.glow, bounce: S.bounce } },
      { k: 'speakColor', t: 'color', label: S.speakColor },
      { k: 'accentColor', t: 'color', label: S.accentColor },
      { k: 'textColor', t: 'color', label: S.textColor },
      { k: 'bgColor', t: 'color', label: S.bgColor },
      { k: 'bgOpacity', t: 'range', label: S.bgOpacity, min: 0, max: 100, unit: '%' },
      { k: 'font', t: 'font', label: S.font },
      { k: 'bold', t: 'bool', label: S.bold },
      { k: 'animate', t: 'bool', label: S.animate },
    ]],
    [S.secAdvanced, [
      { k: 'customCss', t: 'css', label: S.customCss, help: S.cssHelp },
    ]],
  ];

  // ---------- Réglages ----------
  const SYSTEM_FONTS = ['Segoe UI', 'Arial', 'Verdana', 'Trebuchet MS', 'Georgia', 'Impact', 'Consolas', 'Comic Sans MS', 'Bahnschrift'];
  let settings = {}, defaults = {}, saveTimer, saveFlush = null;
  let profiles = [], cur = null, port = 47474, linksCount = 0;
  let files = { builtinFonts: [], fonts: [] };
  const post = (url, body) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const loadFiles = async () => (files = await (await fetch('/api/files')).json());
  const upload = async (kind, file) => (await fetch(`/api/upload?kind=${kind}&name=${encodeURIComponent(file.name)}`, { method: 'POST', body: file })).json();

  const INGAME = 'ingame';
  let ingame = { enabled: false, hotkey: 'Ctrl+Shift+O', settings: {}, defaults: {} }, igPrev = null, igOk = true, igPlacing = false;
  const ingameP = { id: INGAME, name: '', get settings() { return ingame.settings; }, set settings(v) { ingame.settings = v; } };
  const curP = () => cur === INGAME ? ingameP : profiles.find(p => p.id === cur);
  const curDefaults = () => cur === INGAME ? ingame.defaults : defaults;
  const profileUrl = id => `http://localhost:${port}/?profile=${encodeURIComponent(id)}`;

  // ---------- Profils d'overlay ----------
  function drawTabs() {
    const box = $('profTabs');
    box.textContent = '';
    for (const p of profiles) {
      const b = el('button', { className: p.id === cur ? 'on' : '', textContent: p.name });
      b.onclick = () => selectProfile(p.id);
      box.append(b);
    }
    const add = el('button', { className: 'add', textContent: S.profNew });
    add.onclick = createProfile;
    box.append(add);
  }
  function selectProfile(id) {
    if (saveFlush) saveFlush();
    if (cur === INGAME && $('styleBox').parentElement !== $('pane-style')) $('pane-style').append($('styleBox'));
    cur = profiles.some(p => p.id === id) ? id : profiles[0].id;
    try { localStorage.setItem('voProfile', cur); } catch {}
    settings = curP().settings;
    $('profName').value = curP().name;
    $('obsUrl').value = profileUrl(cur);
    document.querySelector('#stage iframe').src = `/?preview&profile=${encodeURIComponent(cur)}`;
    fitSource();
    $('profDelRow').hidden = profiles.length < 2;
    resetDel();
    drawTabs();
    buildForm();
  }
  async function createProfile() {
    if (saveFlush) saveFlush();
    const j = await (await post('/api/profiles', { action: 'create', id: cur, name: S.newProfile(profiles.length + 1) })).json();
    if (j.error) return alertMsg(j.error);
    profiles = j.profiles;
    selectProfile(j.profile.id);
    $('profName').focus();
    $('profName').select();
  }
  let delArmed = false, delTimer;
  function resetDel() { delArmed = false; clearTimeout(delTimer); $('profDel').textContent = S.profDel; $('profDel').classList.remove('confirm'); }
  async function deleteProfile() {
    if (!delArmed) {
      delArmed = true;
      $('profDel').textContent = S.profDelConfirm;
      $('profDel').classList.add('confirm');
      delTimer = setTimeout(resetDel, 4000);
      return;
    }
    const j = await (await post('/api/profiles', { action: 'delete', id: cur })).json();
    if (j.error) return alertMsg(j.error);
    profiles = j.profiles;
    selectProfile(profiles[0].id);
  }
  function alertMsg(e) { $('importMsg').style.color = ''; $('importMsg').textContent = msg(e); }

  function save() {
    clearTimeout(saveTimer);
    const body = { profile: cur, settings: { ...settings } };
    saveFlush = () => { clearTimeout(saveTimer); saveFlush = null; post('/api/settings', body); };
    saveTimer = setTimeout(saveFlush, 120);
    drawPresets();
  }

  function fillFonts(select, current) {
    select.textContent = '';
    const group = (label, names) => {
      if (!names.length) return;
      const g = el('optgroup', { label });
      for (const n of names) { const o = el('option', { value: n, textContent: n }); o.style.fontFamily = `"${n}"`; g.append(o); }
      select.append(g);
    };
    const custom = files.fonts.map(f => f.family);
    group(S.fontMine, custom);
    group(S.fontBuiltin, files.builtinFonts);
    group(S.fontSystem, SYSTEM_FONTS);
    if (![...custom, ...files.builtinFonts, ...SYSTEM_FONTS].includes(current)) select.prepend(el('option', { value: current, textContent: current }));
    select.value = current;
  }

  function buildForm() {
    const form = $('form');
    form.textContent = '';
    for (const [title, fields] of schema()) {
      // Chaque partie se replie ; on retient lesquelles sont ouvertes.
      const sec = el('details', { className: 'group' }, el('summary', {}, el('span', { textContent: title })));
      const key = 'voOpen:' + (fields[0] && fields[0].k);
      let open = null;
      try { open = localStorage.getItem(key); } catch {}
      sec.open = open === null ? ['layout', 'effect'].includes(fields[0] && fields[0].k) : open === '1';
      sec.ontoggle = () => { try { localStorage.setItem(key, sec.open ? '1' : '0'); } catch {} };
      for (const f of fields) {
        const id = 'f_' + f.k;
        const label = el('span', {}, el('label', { htmlFor: id, textContent: f.label }));
        if (f.help) label.append(el('small', { textContent: f.help }));
        let input, extra = null, stack = false, after = null;
        const set = v => { settings[f.k] = v; save(); };
        if (f.t === 'bool') {
          input = el('input', { type: 'checkbox', checked: settings[f.k] });
          input.onchange = () => set(input.checked);
        } else if (f.t === 'select') {
          input = el('select', {}, ...Object.entries(f.opts).map(([v, t]) => el('option', { value: v, textContent: t })));
          input.value = settings[f.k];
          input.onchange = () => set(input.value);
        } else if (f.t === 'range') {
          extra = el('span', { className: 'val', textContent: settings[f.k] + f.unit });
          input = el('input', { type: 'range', min: f.min, max: f.max, value: settings[f.k] });
          input.oninput = () => { extra.textContent = input.value + f.unit; set(Number(input.value)); };
        } else if (f.t === 'color') {
          input = el('input', { type: 'color', value: settings[f.k] });
          input.oninput = () => set(input.value);
        } else if (f.t === 'font') {
          input = el('select');
          fillFonts(input, settings.font);
          const picker = el('input', { type: 'file', accept: '.ttf,.otf,.woff,.woff2', hidden: true });
          const add = el('button', { className: 'ghost', textContent: S.fontAdd });
          const del = el('button', { className: 'ghost', textContent: S.fontDel });
          const err = el('small', { className: 'err' });
          const sync = () => { del.hidden = !files.fonts.some(x => x.family === input.value); };
          input.onchange = () => { set(input.value); sync(); };
          add.onclick = () => picker.click();
          picker.onchange = async () => {
            const file = picker.files[0];
            picker.value = '';
            if (!file) return;
            const j = await upload('font', file);
            err.textContent = msg(j.error);
            if (j.error) return;
            await loadFiles();
            $('fontcss').href = '/fonts.css?v=' + Date.now();
            fillFonts(input, j.family);
            set(j.family); sync();
          };
          del.onclick = async () => {
            const cur = files.fonts.find(x => x.family === input.value);
            if (!cur) return;
            await post('/api/delete-file', { kind: 'font', file: cur.file });
            await loadFiles();
            fillFonts(input, 'Inter');
            set('Inter'); sync();
          };
          sync();
          after = el('div', { className: 'row', style: 'justify-content:flex-start;flex-wrap:wrap' }, add, del, picker, err, el('small', { textContent: S.fontHelp }));
        } else if (f.t === 'css') {
          stack = true;
          input = el('textarea', { value: settings[f.k], spellcheck: false, placeholder: '.name { text-transform: uppercase; }' });
          input.oninput = () => set(input.value);
        } else {
          stack = true;
          input = el('input', { type: 'text', value: settings[f.k] });
          input.oninput = () => set(input.value);
        }
        input.id = id;
        const row = el('div', { className: 'row' + (stack ? ' stack' : '') }, label, input);
        if (extra) row.append(extra);
        sec.append(row);
        if (after) sec.append(after);
      }
      form.append(sec);
    }
    drawPresets();
  }

  // ---------- Styles prêts à l'emploi ----------
  // Seulement l'apparence : le titre, qui afficher et le CSS personnalisé restent ceux de l'utilisateur.
  const PRESETS = {
    classic: { layout: 'column', size: 40, gap: 6, shape: 'circle', effect: 'ring', speakColor: '#23a55a', accentColor: '#5865f2', textColor: '#ffffff', bgColor: '#1e1f22', bgOpacity: 90, font: 'Inter', bold: true },
    minimal: { layout: 'column', size: 36, gap: 4, shape: 'circle', effect: 'ring', speakColor: '#ffffff', accentColor: '#ffffff', textColor: '#ffffff', bgColor: '#000000', bgOpacity: 0, font: 'Poppins', bold: false },
    esport: { layout: 'column', size: 40, gap: 6, shape: 'square', effect: 'glow', speakColor: '#ff4655', accentColor: '#ff4655', textColor: '#ffffff', bgColor: '#140608', bgOpacity: 88, font: 'Rajdhani', bold: true },
    light: { layout: 'column', size: 40, gap: 6, shape: 'rounded', effect: 'ring', speakColor: '#23a55a', accentColor: '#8b6cff', textColor: '#1b1c20', bgColor: '#ffffff', bgOpacity: 95, font: 'Rubik', bold: true },
    hextech: { layout: 'column', size: 40, gap: 6, shape: 'circle', effect: 'ring', speakColor: '#c8aa6e', accentColor: '#0ac8b9', textColor: '#f0e6d2', bgColor: '#010a13', bgOpacity: 90, font: 'Montserrat', bold: true },
  };
  let presetUndo = null;
  const hexA = (hex, pct) => { const n = parseInt(String(hex).slice(1), 16) || 0; return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${pct / 100})`; };
  const isPreset = (k, st) => Object.entries(PRESETS[k]).every(([key, v]) => st[key] === v);
  function drawPresets() {
    const box = $('presets');
    box.textContent = '';
    for (const [k, p] of Object.entries(PRESETS)) {
      // Petit aperçu : trois personnes, celle du milieu parle.
      const mini = el('div', { className: 'mini' + (p.layout === 'row' ? ' row' : '') });
      const radius = { circle: '50%', rounded: '28%', square: '0' }[p.shape];
      ['Caillou', 'Zed', 'Bally'].forEach((n, i) => {
        const dot = el('span', { className: 'dot' });

    const before = free.find(r => { const b = r.getBoundingClientRect(); return y < b.top + b.height / 2; });
    // On déplace les voisins, jamais la ligne tenue : sinon le navigateur lâche le doigt ou la souris.
    const box = $('people');
    const others = [...box.children].filter(r => r !== row);
    const want = before ? others.indexOf(before) : others.length;
    let at = [...box.children].indexOf(row);
    while (at > want) { box.insertBefore(row.previousElementSibling, row.nextElementSibling); at--; }
    while (at < want) { box.insertBefore(row.nextElementSibling, row); at++; }

  // Application ID : 17 à 20 chiffres, trouvé aussi dans l'adresse de la page (…/applications/<id>/…).
  function readId(raw) {
    const t = String(raw || '').trim();
    if (/^\d{15,22}$/.test(t)) return { id: t };
    const m = /applications\/(\d{15,22})/.exec(t) || (/\D/.test(t) && /(?:^|\D)(\d{17,20})(?:\D|$)/.exec(t));
    if (m) return { id: m[1], fromUrl: true };
    if (/^[0-9a-f]{64}$/i.test(t)) return { looksKey: true };
    if (/^[\w-]{24,64}$/.test(t) && /[a-z]/i.test(t)) return { looksSecret: true };
    return {};
  }
  function readSecret(raw) {
    const t = String(raw || '').trim();
    if (!t) return { empty: true };
    if (/^\d{15,22}$/.test(t)) return { looksId: true };
    if (/^[0-9a-f]{64}$/i.test(t)) return { looksKey: true };
    if (/^[\w-]{20,48}$/.test(t)) return { ok: t };
    return {};

    okEl.innerHTML = ICONS.check;
    hintEl.textContent = text || '';

      $('wzOauth').href = `https://discord.com/developers/applications/${r.id}/oauth2`;
      return r.id;
    }
    const empty = !$('cid').value.trim();
    setField($('cid'), $('cidOk'), $('cidHint'), empty && !final ? '' : 'bad', empty && !final ? '' : r.looksKey ? S.idIsKey : r.looksSecret ? S.idIsSecret : S.idBad);
    return null;
  }
  function checkSecret(final) {
    const r = readSecret($('csecret').value);
    const keep = r.empty && wz.hasConfig && $('cid').value.trim() === wz.savedId;
    if (r.ok) setField($('csecret'), $('csecretOk'), $('csecretHint'), 'good', S.secretOk);

    wz.open = true;
    wz.step = step;
    $('wizard').hidden = false;
    panels.forEach((p, i) => (p.hidden = i !== step));
    $('wzDots').textContent = '';
    for (let i = 0; i < 3; i++) $('wzDots').append(el('i', { className: i < step ? 'done' : i === step ? 'on' : '' }));
    $('wzBack').hidden = step === 0 || step === 3;
    $('wzNext').hidden = step >= 2;
    $('wzNext').textContent = step === 1 ? S.wzConnect : S.wzNext;
    $('wzErr').textContent = '';
    if (step === 0) { checkId(false); setTimeout(() => $('cid').focus(), 50); }
    if (step === 1) { checkId(false); checkSecret(false); }
    if (step === 2) wzState();
    if (step === 3) wzDone();
    $('wizard').scrollTop = 0;
  }
  function wzClose() { wz.open = false; $('wizard').hidden = true; }

  // Où renvoyer selon l'erreur de Discord.
  function errTarget(m) {
    const t = (m && (m.fr || m)) || '';
    // « codes refusés » cite aussi l'identifiant : on le teste en premier.
    if (/Redirect|codes/i.test(t)) return { step: 1, tip: 'redirect' };
    if (/Secret|secrète/i.test(t)) return { step: 1, tip: 'secret' };
    if (/Client ID|identifiant/i.test(t)) return { step: 0, tip: 'id' };
    return null;
  }
  function wzState() {
    const s = wz.last;
    if (!s) return;
    if (s.status === 'connected') return wzShow(3);
    const v = S.st[s.status] || S.st.wait;
    const icon = s.status === 'auth' ? ['hand', ''] : s.status === 'no-discord' ? ['plug', ''] : s.status === 'error' ? ['alert', 'bad'] : ['wait', 'wait'];
    $('wzIcon').className = icon[1];
    $('wzIcon').innerHTML = ICONS[icon[0]];
    $('wzTitle').textContent = v[0];
    $('wzText').textContent = s.status === 'error' ? msg(s.statusMsg) : v[1];
    const target = s.status === 'error' ? errTarget(s.statusMsg) : null;
    const tips = s.status === 'no-discord' ? S.noDiscordTips : target ? [S.errTips[target.tip]] : [];
    $('wzTips').innerHTML = tips.map(t => `<li>${t}</li>`).join('');
    $('wzTips').hidden = !tips.length;
    $('wzFail').hidden = !(s.status === 'error' || s.status === 'no-discord');
    $('wzFix').hidden = !target;
    $('wzFix').onclick = () => target && wzShow(target.step);
  }
  function wzDone() {
    const s = wz.last || {};
    $('wzDoneIcon').className = 'ok';
    $('wzDoneIcon').innerHTML = ICONS.check;
    $('wzDoneTitle').textContent = S.w4Done(s.user || '');
  }
  function wizardTick(s) {
    wz.last = s;
    if (!wz.seen) { wz.seen = true; if (s.status === 'setup') wzShow(0); }
    if (wz.open && wz.step === 2) wzState();
  }

  function bind() {
    $('wzBack').onclick = () => wzShow(wz.step - 1);
    $('wzNext').onclick = async () => {
      if (wz.step === 0) { if (checkId(true)) wzShow(1); else $('cid').focus(); return; }
      const id = checkId(true);
      if (!id) return wzShow(0);
      const secret = checkSecret(true);
      if (secret === null) return $('csecret').focus();
      const r = await post('/api/config', { clientId: id, clientSecret: secret });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) return ($('wzErr').textContent = msg(j.error));
      wz.hasConfig = true; wz.savedId = id;
      $('csecret').value = '';
      $('csecret').placeholder = S.wz3Keep;
      wz.last = { ...(wz.last || {}), status: 'starting' };
      wzShow(2);
    };
    $('cid').addEventListener('input', () => { $('wzErr').textContent = ''; checkId(false); });
    $('cid').addEventListener('paste', () => setTimeout(() => checkId(true), 0));
    $('cid').addEventListener('keydown', e => { if (e.key === 'Enter') $('wzNext').click(); });
    $('csecret').addEventListener('input', () => { $('wzErr').textContent = ''; checkSecret(false); });
    $('csecret').addEventListener('keydown', e => { if (e.key === 'Enter') $('wzNext').click(); });
    $('wzClose').onclick = wzClose;
    $('wzFinish').onclick = wzClose;
    $('wzRetry').onclick = () => { wz.last = { ...(wz.last || {}), status: 'starting' }; wzState(); post('/api/retry'); };
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && wz.open) wzClose(); });
    $('credBtn').onclick = () => wzShow(0);
    for (const b of document.querySelectorAll('[data-copy]')) b.onclick = async () => {
      const text = b.dataset.copy || (b.id === 'copyBtn' ? $('obsUrl').value : $('wzUrl').textContent);
      try { await navigator.clipboard.writeText(text); } catch {}
      const old = b.textContent;
      b.textContent = S.copied;
      setTimeout(() => (b.textContent = old), 1500);
    };
    const bgs = [...document.querySelectorAll('[data-bg]')];
    for (const b of bgs) b.onclick = () => { $('stage').className = b.dataset.bg; for (const x of bgs) x.classList.toggle('on', x === b); };
    bgs[0].classList.add('on');

    confirmTwice($('peopleReset'), () => S.peopleReset, () => S.resetConfirm, () => post('/api/people-reset'));
    $('linksReset').onclick = () => { $('linksWhy').textContent = S.linksWhy(linksCount); $('linksAsk').hidden = false; $('linksNo').focus(); };
    $('linksNo').onclick = () => { $('linksAsk').hidden = true; };
    $('linksYes').onclick = () => { $('linksAsk').hidden = true; post('/api/dpm-forget', {}); };
    $('forgetSel').onchange = () => post('/api/people-forget', { minutes: Number($('forgetSel').value) });
    $('dataBtn').onclick = () => post('/api/open-data');
    $('quitBtn').onclick = async () => { await post('/api/quit'); $('quitBtn').textContent = S.stopped; };
    $('autostart').onchange = async () => {
      const j = await (await post('/api/autostart', { enabled: $('autostart').checked })).json();
      $('autostart').checked = !!j.autostart;
    };
    confirmTwice($('resetBtn'), () => S.resetBtn, () => S.resetConfirm, () => { settings = curP().settings = { ...curDefaults() }; buildForm(); save(); });
    $('presetUndo').onclick = undoPreset;
    $('updateInstall').onclick = async () => {
      $('updateInstall').hidden = true;
      $('updateState').textContent = S.updDownloading;
      const j = await (await post('/api/update-install')).json().catch(() => ({}));
      if (j.error) $('updateState').textContent = S.updError(msg(j.error));
    };
    $('diagBtn').onclick = copyDiagnostics;

    // Profils
    $('profDel').onclick = deleteProfile;
    let renameT;
    $('profName').oninput = () => {
      const name = $('profName').value;
      if (name.trim()) { curP().name = name.trim(); drawTabs(); }
      clearTimeout(renameT);
      renameT = setTimeout(() => name.trim() && post('/api/profiles', { action: 'rename', id: cur, name }), 300);
    };
    $('profName').onblur = () => { if (!$('profName').value.trim()) $('profName').value = curP().name; };

    // Langue : on enregistre puis on recharge la page
    $('langSel').value = lang;
    $('langSel').onchange = async () => { if (saveFlush) saveFlush(); await post('/api/lang', { lang: $('langSel').value }); location.reload(); };

    // Export / import du style
    $('exportBtn').onclick = () => {
      const style = { ...settings };
      const a = el('a', { href: URL.createObjectURL(new Blob([JSON.stringify({ voiceOverlayStyle: 1, style }, null, 2)], { type: 'application/json' })), download: `voice-overlay-${cur}.json` });
      document.body.append(a);
      a.click();
      a.remove();
    };
    $('importBtn').onclick = () => $('importPicker').click();
    $('importPicker').onchange = async () => {
      const file = $('importPicker').files[0];
      $('importPicker').value = '';
      if (!file) return;
      let data = null;
      try { data = JSON.parse(await file.text()); } catch {}
      const ok = data && data.voiceOverlayStyle === 1 && data.style && typeof data.style === 'object';
      $('importMsg').style.color = ok ? 'var(--ok)' : '';
      $('importMsg').textContent = ok ? S.importOk : S.importBad;
      if (!ok) return;
      for (const k of Object.keys(curDefaults())) if (k in data.style && typeof data.style[k] === typeof curDefaults()[k]) settings[k] = data.style[k];
      buildForm();
      save();
    };
  }

  // ---------- Démarrage ----------
  (async () => {
    const [s] = await Promise.all([fetch('/api/state').then(r => r.json()), loadFiles()]);
    profiles = s.profiles;
    defaults = s.defaults;
    port = s.port;
    lang = s.lang === 'fr' || s.lang === 'en' ? s.lang : ((navigator.language || '').toLowerCase().startsWith('fr') ? 'fr' : 'en');
    S = L[lang];
    document.documentElement.lang = lang;
    for (const e of document.querySelectorAll('[data-t]')) e.innerHTML = S[e.dataset.t];
    for (const e of document.querySelectorAll('[data-tp]')) e.placeholder = S[e.dataset.tp];

    $('cid').value = s.clientId || '';
    wz.hasConfig = !!s.hasConfig; wz.savedId = s.clientId || '';
    if (s.hasConfig) $('csecret').placeholder = S.wz3Keep;
    $('autoRow').hidden = !s.canAutostart;
    $('dataRow').hidden = !s.isExe;
    $('dataPath').textContent = s.dataDir;
    $('autostart').checked = !!s.autostart;
    $('wzUrl').textContent = profileUrl(profiles[0].id);
    $('forgetSel').value = String(s.forgetAfter);
    $('ver').textContent = `${S.version} ${s.version}`;
    bootVersion = s.version;
    $('diagRow').hidden = !(s.features || []).includes('diagnostics');
    $('tab-ingame').hidden = !(s.features || []).includes('ingame');
    if (s.ingame) ingame = { ...s.ingame };
    bind();
    bindIngame();
    bindPreview();
    let last = null;
    try { last = localStorage.getItem('voProfile'); } catch {}
    selectProfile(last);
    bindTabs();

    const es = new EventSource('/events');
    let lastSnap = null;
    es.onmessage = e => { const snap = lastSnap = JSON.parse(e.data); showStatus(snap); showPeople(snap); showIngame(snap); };
    es.addEventListener('speaking', e => {
      if (!lastSnap) return;
      const on = new Set(JSON.parse(e.data).speaking);
      for (const m of lastSnap.members) { m.speaking = on.has(m.id); const r = rows.get(m.id); if (r) r.row.classList.toggle('speaking', m.speaking); }
    });
    es.onerror = () => {
      // Pendant une mise à jour, l'appli redémarre : la page se reconnecte toute seule.
      $('statusText').textContent = updating ? S.updRestarting : S.status.closed;
      $('dot').style.background = updating ? 'var(--warn)' : 'var(--bad)';
    };
  })();
</script>
</body>
</html>
